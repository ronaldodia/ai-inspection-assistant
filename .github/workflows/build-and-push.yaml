name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'INFRASTRUCTURE.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'INFRASTRUCTURE.md'
      - '**.md'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend/worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Delete old backend image versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-backend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.inspect.example.com' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Delete old frontend image versions
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}-frontend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  update-manifests:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags in k8s manifests
        run: |
          set -euo pipefail
          BACKEND_TAG="${{ needs.build-backend.outputs.tag }}"
          FRONTEND_TAG="${{ needs.build-frontend.outputs.tag }}"

          sed -i -E "s#(image: ${BACKEND_IMAGE}):[^[:space:]]+#\1:${BACKEND_TAG}#" k8s/04-backend.yaml k8s/05-worker.yaml
          sed -i -E "s#(image: ${FRONTEND_IMAGE}):[^[:space:]]+#\1:${FRONTEND_TAG}#" k8s/06-frontend.yaml

          echo "backend  -> ${BACKEND_IMAGE}:${BACKEND_TAG}"
          echo "frontend -> ${FRONTEND_IMAGE}:${FRONTEND_TAG}"
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}

      - name: Commit and push updated manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/; then
            echo "No manifest changes, skipping commit."
            exit 0
          fi
          git add k8s/04-backend.yaml k8s/05-worker.yaml k8s/06-frontend.yaml
          git commit -m "chore(k8s): deploy ${{ needs.build-backend.outputs.tag }}"
          git push
