name: Build & Push Docker Images

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'k8s/**'
      - 'INFRASTRUCTURE.md'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'INFRASTRUCTURE.md'
      - '**.md'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  FRONTEND_AZURE_IMAGE: ghcr.io/${{ github.repository }}-frontend-azure

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libglib2.0-0 libffi-dev shared-mime-info fonts-liberation

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Check coverage threshold (warning only, never fails the build)
        working-directory: backend
        run: |
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate'])*100, 1))")
          echo "Couverture de tests : ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov < 75) print "::warning::Couverture de tests à " cov "% — sous le seuil de 75% (avertissement seulement, ne bloque pas le pipeline).";
          }'

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend tags
        id: tags
        run: |
          set -euo pipefail
          TAGS="${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}"
          # :latest est le défaut de infra/main.bicep (backendImage) pour un premier
          # déploiement Azure — ne doit jamais être écrasé par un build dev, sinon
          # un déploiement prod "à blanc" partirait sur du code non voulu.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS
          ${{ env.BACKEND_IMAGE }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend/worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.inspectra.dev.evoluops.com' }}
            NEXT_PUBLIC_DEBUG=${{ github.ref == 'refs/heads/dev' && 'true' || 'false' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # NEXT_PUBLIC_API_URL est figé au build de l'image — la déploiement k8s et le
  # déploiement Azure App Service n'ont pas le même backend, donc le frontend a
  # besoin de sa propre image pour chaque cible. Ce job est ignoré tant que
  # vars.AZURE_RESOURCE_GROUP n'est pas configuré (voir infra/README.md).
  build-frontend-azure:
    # Azure App Service est l'environnement principal (déployé uniquement depuis
    # main) — sans ce garde-fou, un push sur dev déclencherait aussi un déploiement
    # en prod, alors que dev n'a que microk8s/ArgoCD comme cible.
    if: github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Azure frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.AZURE_NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.FRONTEND_AZURE_IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.FRONTEND_AZURE_IMAGE }}:latest
          cache-from: type=gha,scope=frontend-azure
          cache-to: type=gha,mode=max,scope=frontend-azure

  deploy-azure:
    needs: [build-backend, build-frontend-azure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Web Apps to the new image tags
        run: |
          set -euo pipefail
          BACKEND_TAG="${{ needs.build-backend.outputs.tag }}"
          FRONTEND_TAG="${{ needs.build-frontend-azure.outputs.tag }}"

          az webapp config container set \
            --name "${{ vars.AZURE_BACKEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ env.BACKEND_IMAGE }}:${BACKEND_TAG}"

          az webapp config container set \
            --name "${{ vars.AZURE_WORKER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ env.BACKEND_IMAGE }}:${BACKEND_TAG}"

          az webapp config container set \
            --name "${{ vars.AZURE_FRONTEND_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ env.FRONTEND_AZURE_IMAGE }}:${FRONTEND_TAG}"

  update-manifests:
    needs: [build-backend, build-frontend]
    # ArgoCD ne suit que k8s/ sur dev — bumper les tags sur main aussi ne sert à
    # rien (App Service se déploie via deploy-azure, pas depuis ces manifests) et
    # ne fait que produire des commits bot qui entrent en conflit à chaque rebase
    # dev -> main / main -> dev sur les mêmes lignes image:.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags in k8s manifests
        run: |
          set -euo pipefail
          BACKEND_TAG="${{ needs.build-backend.outputs.tag }}"
          FRONTEND_TAG="${{ needs.build-frontend.outputs.tag }}"

          sed -i -E "s#(image: ${BACKEND_IMAGE}):[^[:space:]]+#\1:${BACKEND_TAG}#" k8s/04-backend.yaml k8s/05-worker.yaml
          sed -i -E "s#(image: ${FRONTEND_IMAGE}):[^[:space:]]+#\1:${FRONTEND_TAG}#" k8s/06-frontend.yaml

          echo "backend  -> ${BACKEND_IMAGE}:${BACKEND_TAG}"
          echo "frontend -> ${FRONTEND_IMAGE}:${FRONTEND_TAG}"
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}

      - name: Regenerate postgres-init ConfigMap from schema.sql
        run: |
          set -euo pipefail
          {
            echo "# Généré automatiquement par le workflow CI depuis backend/schema.sql — ne pas éditer à la main."
            kubectl create configmap postgres-init \
              --from-file=schema.sql=backend/schema.sql \
              --namespace inspect-ia \
              --dry-run=client -o yaml
          } > k8s/01c-postgres-init-configmap.yaml

      - name: Commit and push updated manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/; then
            echo "No manifest changes, skipping commit."
            exit 0
          fi
          git add k8s/04-backend.yaml k8s/05-worker.yaml k8s/06-frontend.yaml k8s/01c-postgres-init-configmap.yaml
          git commit -m "chore(k8s): deploy ${{ needs.build-backend.outputs.tag }}"
          git push
