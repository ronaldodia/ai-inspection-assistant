# Usage local uniquement (développement). Le déploiement réel se fait via k8s/ (voir readme.md).
# Démarrer : ./dev.sh   (ou directement `docker compose up --build -d`)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspect_app
      POSTGRES_USER: inspect_app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inspect_app -d inspect_app"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inspect_app:devpassword@postgres:5432/inspect_app
      PHOTOS_DIR: /data/photos
      REPORTS_DIR: /data/reports
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
      - ./backend/scripts:/app/scripts
      - inspect_data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m worker.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inspect_app:devpassword@postgres:5432/inspect_app
      PHOTOS_DIR: /data/photos
      REPORTS_DIR: /data/reports
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
      - inspect_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  inspect_data:
  frontend_node_modules:
  frontend_next:
