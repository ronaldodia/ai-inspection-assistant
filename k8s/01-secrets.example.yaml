# Copier ce fichier en 01-secrets.yaml, remplir les vraies valeurs, puis:
#   kubectl apply -f k8s/01-secrets.yaml
# NE JAMAIS commit 01-secrets.yaml (à ajouter au .gitignore).
#
# SECRET_KEY : générer avec `openssl rand -hex 32`
# POSTGRES_PASSWORD : un mot de passe fort, doit correspondre à celui dans DATABASE_URL
apiVersion: v1
kind: Secret
metadata:
  name: inspect-ia-secrets
  namespace: inspect-ia
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  DATABASE_URL: "postgresql://inspect_app:CHANGE_ME_postgres_password@postgres:5432/inspect_app"
  SECRET_KEY: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  ANTHROPIC_API_KEY: "sk-ant-CHANGE_ME"
