# Nécessaire uniquement si les packages GHCR restent privés.
# Si vous rendez ghcr.io/ronaldodia/ai-inspection-assistant-{backend,frontend} publics
# (Package settings > Change visibility sur github.com), ce secret n'est pas nécessaire :
# retirez alors `imagePullSecrets` des manifests 04/05/06.
#
# Sinon, générez un PAT (classic) avec le scope `read:packages` sur
# https://github.com/settings/tokens, puis :
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<votre-user-github> \
#     --docker-password=<le-PAT> \
#     -n inspect-ia
#
# Ce fichier est un pense-bête ; le secret réel se crée avec la commande ci-dessus,
# ne pas commit de PAT en clair.
