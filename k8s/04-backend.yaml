apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: inspect-ia
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/ronaldodia/ai-inspection-assistant-backend:sha-9a6a007
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: inspect-ia-secrets
          env:
            - name: PHOTOS_DIR
              value: /data/photos
            - name: REPORTS_DIR
              value: /data/reports
            - name: CORS_ORIGINS
              value: '["https://inspectra.dev.evoluops.com"]'
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inspect-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: inspect-ia
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
