apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: inspect-ia
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/ronaldodia/ai-inspection-assistant-backend:sha-cbc4552
          command: ["python", "-m", "worker.worker"]
          envFrom:
            - secretRef:
                name: inspect-ia-secrets
          env:
            - name: PHOTOS_DIR
              value: /data/photos
            - name: REPORTS_DIR
              value: /data/reports
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inspect-data
