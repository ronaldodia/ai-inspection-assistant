apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inspect-ia
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/ronaldodia/ai-inspection-assistant-frontend:sha-7d63046
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: inspect-ia
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
