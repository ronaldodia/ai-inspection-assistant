# NEXT_PUBLIC_API_URL est figé au build du frontend (voir readme "Déploiement") — il
# doit correspondre au host api.* utilisé ici (https://api.inspect.evoluops.com).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inspect-ia
  namespace: inspect-ia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inspect.evoluops.com
        - api.inspect.evoluops.com
      secretName: inspect-ia-tls
  rules:
    - host: inspect.evoluops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.inspect.evoluops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
