# NEXT_PUBLIC_API_URL est figé au build du frontend (voir readme "Déploiement") — il
# doit correspondre au host api.* utilisé ici (https://api.inspectra.dev.evoluops.com).
# Nécessite un enregistrement DNS pour *.dev.evoluops.com (ou les deux hosts
# explicitement) — le wildcard existant *.evoluops.com ne couvre pas ce
# sous-domaine à deux niveaux.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inspect-ia
  namespace: inspect-ia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inspectra.dev.evoluops.com
        - api.inspectra.dev.evoluops.com
      secretName: inspectra-dev-tls
  rules:
    - host: inspectra.dev.evoluops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.inspectra.dev.evoluops.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
